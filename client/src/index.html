<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TFT Analyzer</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Main Header -->
    <header>
        <h1>TFT Analyzer</h1>
        <p>Analyze your Teamfight Tactics games.</p>
    </header>

    <!-- Main Menu -->
    <main>

        <section id="search-section">

            <h2>Enter your Riot ID</h2>

            <form id="player-search">

                <label for="game-name"></label>
                <input
                    type="text"
                    id="riot-id"
                    name="riot-id"
                    placeholder="Enter Riot ID, ie. player#NA1"
                    required
                >

                <button type="submit">
                    Search
                </button>

            </form>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="js/main.js"></script>

</body>

</html>
