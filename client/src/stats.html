<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFT Analyzer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/stats.css">
</head>
<body>
    <!-- STATS SECTION -->
    <section id="stats">
        <div class="stats-content">
            <header class="stats-header">
                <h1>Stats</h1>
                <p id="header_summoner"></p>
            </header>
            <section id="overview">
                <div class="stat-card">
                    <h2>Total Games</h2>
                    <p id="total-games">-</p>
                </div>
                <div class="stat-card">
                    <h2>Average Placement</h2>
                    <p id="average-placement">-</p>
                </div>
                <div class="stat-card">
                    <h2>Top 4 Rate</h2>
                    <p id="top-four-rate">-</p>
                </div>
                <div class="stat-card">
                    <h2>Average Level</h2>
                    <p id="average-level">-</p>
                </div>
                <div class="stat-card">
                    <h2>Average End Gold</h2>
                    <p id="average-gold">-</p>
                </div>
                <div class="stat-card">
                    <h2>Average Damage</h2>
                    <p id="average-damage">-</p>
                </div>
            </section>
        </div>
    </section>
    <section id="matches">
        <div class="matches-content">
            <header class="matches-header">
                <h2>Recent Matches</h2>
            </header>
            <div id="matches-list"></div>
        </div>
    </section>

    <!-- Match Template -->
    <template id="match-template">
        <div class="match-card">
            <div class="match-header">
                <span class="match-placement"></span>
                <span class="match-queue"></span>
            </div>
            <div class="match-summary">
                <div>
                    <span>Level</span>
                    <strong class="match-level"></strong>
                </div>
                <div>
                    <span>Time Alive</span>
                    <strong class="match-time"></strong>
                </div>
                <div>
                    <span>Damage</span>
                    <strong class="match-damage"></strong>
                </div>
            </div>
            <div class="match-details">
                <div class="match-left">
                    <div class="match-traits">
                        <h3>Traits</h3>
                        <div class="trait-list"></div>
                    </div>
                    <div class="match-units">
                        <h3>Units</h3>
                        <div class="unit-list"></div>
                    </div>
                </div>
                <div class="match-analytics">
                    <h3>Analytics</h3>
                    <p>Coming soon...</p>
                </div>
            </div>
        </div>
    </template>

    <!-- JavaScript -->
    <script src="js/stats.js"></script>
    <script src="js/cursor.js"></script>
</body>
</html>
